.contact-row{display:flex;align-items:center;gap:.75rem;font-size:.875rem;color:var(--muted-foreground);text-decoration:none}

<script>
(function(){var K="anushka-portfolio-theme";var t=document.getElementById("theme-toggle"),m=document.getElementById("icon-moon"),s=document.getElementById("icon-sun");
function apply(x){var d=x==="dark";document.documentElement.classList.toggle("dark",d);if(m&&s){m.classList.toggle("hidden",d);s.classList.toggle("hidden",!d);t.setAttribute("aria-label",d?"Switch to light mode":"Switch to dark mode")}try{localStorage.setItem(K,x)}catch(e){}}
if(t){apply(document.documentElement.classList.contains("dark")?"dark":"light");t.addEventListener("click",function(){apply(document.documentElement.classList.contains("dark")?"light":"dark")})}
function scrollTo(sel){var el=document.querySelector(sel);if(el)el.scrollIntoView({behavior:"smooth"})}
document.querySelectorAll(".nav-scroll").forEach(function(el){el.addEventListener("click",function(e){var tg=el.getAttribute("href")||el.getAttribute("data-target")||"";if(tg.charAt(0)==="#"){e.preventDefault();scrollTo(tg);closeMenu()}})});
var mt=document.getElementById("menu-toggle"),mm=document.getElementById("mobile-menu"),im=document.getElementById("icon-menu"),ic=document.getElementById("icon-close");
function closeMenu(){if(!mm||mm.classList.contains("hidden"))return;mm.classList.add("hidden");if(im&&ic){im.classList.remove("hidden");ic.classList.add("hidden")}if(mt)mt.setAttribute("aria-label","Toggle menu")}
if(mt){mt.addEventListener("click",function(){var o=mm.classList.contains("hidden");mm.classList.toggle("hidden");if(im&&ic){im.classList.toggle("hidden",o);ic.classList.toggle("hidden",!o)}})}
var E="xoheat010@gmail.com",f=document.getElementById("contact-form");
if(f){f.addEventListener("submit",function(e){e.preventDefault();var d=new FormData(f),n=String(d.get("name")||""),fe=String(d.get("email")||""),mg=String(d.get("message")||"");window.location.href="mailto:"+E+"?subject="+encodeURIComponent("Portfolio contact from "+n)+"&body="+encodeURIComponent(mg+"\n\n— "+n+" ("+fe+")");f.reset()})}
})();
</script>
